---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backstage-db-creds
  namespace: backstage
spec:
  encryptedData:
    POSTGRES_HOST: 
    POSTGRES_PASSWORD: 
    POSTGRES_PORT: 
    POSTGRES_USER: 
  template:
    metadata:
      name: backstage-db-creds
      namespace: backstage
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: backstage
spec:
  encryptedData:
    AZURE_CLIENT_ID: 
    AZURE_CLIENT_SECRET: 
    AZURE_TENANT_ID: 
    BACKEND_AUTH_KEY: 
    GHC_TOKEN: 
    PORT: 
  template:
    metadata:
      name: app-secrets
      namespace: backstage
    type: Opaque
